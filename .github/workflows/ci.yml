name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easyrail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d easyrail_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir backend typecheck

      - name: Lint
        run: pnpm --dir backend lint

      - name: Run tests
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/easyrail_test
        run: pnpm --dir backend test