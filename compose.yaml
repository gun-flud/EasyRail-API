services:
    postgres:
        image: postgres:16-alpine
        container_name: easyrail_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-easyrail_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easyrail_password}
            POSTGRES_DB: ${POSTGRES_DB:-easyrail_db}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./init-db:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easyrail_user} -d ${POSTGRES_DB:-easyrail_db}"]
            interval: 3s
            timeout: 5s
            retries: 5
        networks:
            - easyrail_network

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: easyrail_pgadmin
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@easyrail.com
            PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:-easyrail_password}
            PGADMIN_CONFIG_SERVER_MODE: "True"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        ports:
            - "127.0.0.1:5051:80"
        networks:
            - easyrail_network

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: easyrail_backend
        ports:
            - "8080:8080"
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            NODE_ENV: development
            PORT: 8080
            HOST: 0.0.0.0
            DATABASE_URL: postgresql://${POSTGRES_USER:-easyrail_user}:${POSTGRES_PASSWORD:-easyrail_password}@postgres:5432/${POSTGRES_DB:-easyrail_db}
            JWT_SECRET: super_secret_jwt_key_easyrail
        networks:
            - easyrail_network

volumes:
    pgdata:
        driver: local
    pgadmin_data:
        driver: local

networks:
    easyrail_network:
        driver: bridge
