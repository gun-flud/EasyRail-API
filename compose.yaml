services:
    postgres:
        image: postgres:18-alpine
        container_name: easyrail_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER:?DB_USER is required}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
            POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
        ports:
            - "${DB_HOST:-127.0.0.1}:${DB_PORT:-6543}:5432"
        volumes:
            - pgdata:/var/lib/postgresql
            - ./migrations:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 3s
            timeout: 5s
            retries: 5
        networks:
            - easyrail_network

    pgadmin:
        image: dpage/pgadmin4:9
        container_name: easyrail_pgadmin
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
            PGADMIN_CONFIG_SERVER_MODE: "True"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        ports:
            - "${PGADMIN_HOST:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
        networks:
            - easyrail_network

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: easyrail_backend
        env_file:
            - ./backend/.env
        ports:
            - "${BACKEND_PORT:-8080}:8080"
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            # NODE_ENV: ${NODE_ENV:-development}
            # PORT: ${PORT:-8080}
            HOST: 0.0.0.0
            DATABASE_URL: postgresql://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:?DB_NAME is required}
            # JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_easyrail}
        networks:
            - easyrail_network

volumes:
    pgdata:
        driver: local
    pgadmin_data:
        driver: local

networks:
    easyrail_network:
        driver: bridge
